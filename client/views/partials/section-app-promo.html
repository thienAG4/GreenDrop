<section class="gd-section-sm">
  <div class="gd-container row align-items-center g-4">
    <div class="col-md-6">
      <h2 class="gd-h2">Mua nhanh hơn với GreenDrop App</h2>
      <p class="text-muted">Mua sắm và theo dõi đơn hàng dễ dàng hơn trên điện thoại của bạn.</p>
      <div class="d-flex gap-2">
        <span class="badge bg-dark p-2"><i class="bi bi-google-play"></i> Google Play</span>
        <span class="badge bg-dark p-2"><i class="bi bi-apple"></i> App Store</span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="gd-phone-mockups">
        <div class="gd-phone-frame" ng-repeat="screen in vm.screens">
          <div class="notch"></div>
          <div class="screen" ng-style="{'background-image': 'url(' + screen + ')'}"></div>
        </div>
      </div>
    </div>
  </div>
