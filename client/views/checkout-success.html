<div class="gd-container gd-section-sm text-center" ng-if="!vm.loading">
  <div class="gd-modal-icon success mx-auto"><i class="bi bi-check-lg"></i></div>
  <h1 class="gd-h1">Cảm ơn bạn đã chọn GreenDrop!</h1>
  <p class="text-muted">Đơn hàng của bạn đã được ghi nhận. Chúng tôi sẽ gửi thông tin xác nhận qua email/SMS trong ít phút.</p>

  <div class="gd-card mx-auto" style="max-width: 420px;">
    <p class="mb-1">Mã đơn hàng</p>
    <h3 class="gd-h3">#ORD-{{ vm.order.order_id }}</h3>
    <p class="mb-1">Tổng thanh toán</p>
    <h3 class="pc-price-current">{{ vm.order.total_amount | gdCurrency }}</h3>
    <a href="/don-hang/{{ vm.order.order_id }}" class="btn-gd btn-gd-primary w-100 mt-2">Chi tiết đơn hàng</a>
  </div>
</div>
