<div class="gd-container gd-section-sm">
  <div class="gd-layout-sidebar">
    <div ng-include="'views/partials/account-sidebar.html'"></div>

    <div>
      <h2 class="gd-h2">Quản lý mật khẩu</h2>
      <div class="gd-card" style="max-width: 480px;">
        <form ng-submit="vm.submit()">
          <div class="gd-field mb-3">
            <label class="gd-label">Mật khẩu hiện tại</label>
            <input type="password" class="form-control-gd" ng-model="vm.form.current_password" required>
          </div>
          <div class="gd-field mb-3">
            <label class="gd-label">Mật khẩu mới</label>
            <input type="password" class="form-control-gd" ng-model="vm.form.new_password" required>
          </div>
          <div class="gd-field mb-3">
            <label class="gd-label">Xác nhận mật khẩu mới</label>
            <input type="password" class="form-control-gd" ng-model="vm.form.confirm_password" required>
            <p class="gd-field-error" ng-if="vm.passwordMismatch()">Mật khẩu xác nhận không khớp</p>
          </div>
          <div class="text-end mb-3"><a href="/quen-mat-khau" style="font-size: 13px;">Quên mật khẩu?</a></div>
          <p class="gd-field-error" ng-if="vm.errorMessage">{{ vm.errorMessage }}</p>
          <p class="gd-field-ok" ng-if="vm.success">Cập nhật mật khẩu thành công!</p>
          <button type="submit" class="btn-gd btn-gd-primary w-100" ng-disabled="vm.submitting || vm.passwordMismatch()">Cập nhật mật khẩu mới</button>
        </form>
      </div>
    </div>
  </div>
</div>
