<div class="gd-container gd-section-sm">
  <div class="gd-layout-sidebar">
    <div ng-include="'views/partials/account-sidebar.html'"></div>

    <div>
      <h2 class="gd-h2">Thông tin cá nhân</h2>
      <p ng-if="vm.loading" class="gd-loading-block">Đang tải...</p>

      <div class="gd-card" ng-if="!vm.loading">
        <div class="d-flex align-items-center gap-3 mb-4">
          <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--gd-bg-pale-green); display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--gd-forest);">
            <i class="bi bi-person"></i>
          </div>
          <div>
            <strong>{{ vm.form.full_name }}</strong>
            <div class="text-muted" style="font-size: 13px;">{{ vm.form.email }}</div>
          </div>
        </div>

        <form ng-submit="vm.update()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="gd-label">Họ và tên</label>
              <input class="form-control-gd" ng-model="vm.form.full_name">
            </div>
            <div class="col-md-6">
              <label class="gd-label">Email</label>
              <input class="form-control-gd" ng-model="vm.form.email" disabled>
            </div>
            <div class="col-md-6">
              <label class="gd-label">Số điện thoại</label>
              <input class="form-control-gd" ng-model="vm.form.phone">
            </div>
            <div class="col-md-6">
              <label class="gd-label">Giới tính</label>
              <select class="form-select-gd" ng-model="vm.form.gender">
                <option value="male">Nam</option>
                <option value="female">Nữ</option>
                <option value="other">Khác</option>
              </select>
            </div>
          </div>
          <p class="gd-field-ok mt-3" ng-if="vm.saved">Cập nhật thành công!</p>
          <button type="submit" class="btn-gd btn-gd-primary mt-3">Cập nhật</button>
        </form>
      </div>
    </div>
  </div>
</div>
