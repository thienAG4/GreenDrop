<div class="gd-auth-layout">
  <div class="gd-auth-image"></div>
  <div class="gd-auth-form-wrap">
    <div class="gd-auth-card">
      <h1>ĐĂNG NHẬP</h1>
      <form ng-submit="vm.submit()">
        <div class="gd-field">
          <label class="gd-label">Email</label>
          <input type="email" class="form-control-gd" ng-model="vm.credentials.email" required>
        </div>
        <div class="gd-field">
          <label class="gd-label">Mật khẩu</label>
          <input ng-attr-type="{{ vm.showPassword ? 'text' : 'password' }}" class="form-control-gd" ng-model="vm.credentials.password" required>
          <i class="bi password-toggle" ng-class="vm.showPassword ? 'bi-eye-slash' : 'bi-eye'" ng-click="vm.togglePassword()"></i>
        </div>
        <div class="text-end mb-3"><a href="/quen-mat-khau" style="font-size: 13px;">Quên mật khẩu</a></div>
        <p class="gd-field-error" ng-if="vm.errorMessage">{{ vm.errorMessage }}</p>
        <button type="submit" class="btn-gd btn-gd-primary w-100" ng-disabled="vm.submitting">Đăng nhập</button>
      </form>
      <div class="gd-auth-footer-link">Chưa có tài khoản? <a href="/dang-ky">Đăng ký tại đây</a></div>
    </div>
  </div>
</div>
