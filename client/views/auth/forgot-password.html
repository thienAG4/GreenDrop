<div class="gd-auth-layout">
  <div class="gd-auth-image"></div>
  <div class="gd-auth-form-wrap">
    <div class="gd-auth-card">
      <h1>QUÊN MẬT KHẨU</h1>
      <p class="text-muted text-center mb-3" style="font-size: 14px;">Nhập email của bạn, chúng tôi sẽ gửi mã xác thực để đặt lại mật khẩu.</p>
      <form ng-submit="vm.submit()">
        <div class="gd-field">
          <label class="gd-label">Email</label>
          <input class="form-control-gd" ng-model="vm.email" required>
          <p class="gd-field-error" ng-if="vm.errorMessage">{{ vm.errorMessage }}</p>
        </div>
        <button type="submit" class="btn-gd btn-gd-primary w-100" ng-disabled="vm.submitting">Gửi</button>
      </form>
      <div class="gd-auth-footer-link"><a href="/dang-nhap">Quay lại đăng nhập</a></div>
    </div>
  </div>
</div>
