<!doctype html>
<html lang="vi" ng-app="adminApp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>GreenDrop Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body ng-controller="ShellController as side">
  <div class="gd-admin-shell" ng-if="!side.isLoginPage()">
    <div class="gd-admin-sidebar-slot" ng-include="'views/partials/sidebar.html'"></div>
    <div class="gd-admin-topbar-slot" ng-include="'views/partials/topbar.html'"></div>
    <main class="gd-admin-main"><div ng-view></div></main>
  </div>
  <div ng-if="side.isLoginPage()"><div ng-view></div></div>

  <gd-success-modal></gd-success-modal>

  <!-- Vendor -->
  <script src="https://cdn.jsdelivr.net/npm/angular@1.8.3/angular.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/angular-route@1.8.3/angular-route.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/angular-animate@1.8.3/angular-animate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App core -->
  <script src="app.js"></script>
  <script src="app.routes.js"></script>

  <!-- Filters -->
  <script src="filters/gd-currency.filter.js"></script>
  <script src="filters/gd-cancel-reason.filter.js"></script>
  <script src="filters/gd-date.filter.js"></script>

  <!-- Services -->
  <script src="services/session.service.js"></script>
  <script src="services/http-interceptor.js"></script>
  <script src="services/auth.service.js"></script>
  <script src="services/notify-modal.service.js"></script>
  <script src="services/dashboard.service.js"></script>
  <script src="services/uploads.service.js"></script>
  <script src="services/datetime-local.service.js"></script>
  <script src="services/orders.service.js"></script>
  <script src="services/products.service.js"></script>
  <script src="services/combos.service.js"></script>
  <script src="services/categories.service.js"></script>
  <script src="services/returns.service.js"></script>
  <script src="services/users.service.js"></script>
  <script src="services/reviews.service.js"></script>
  <script src="services/vouchers.service.js"></script>
  <script src="services/promotions.service.js"></script>
  <script src="services/banners.service.js"></script>
  <script src="services/blog.service.js"></script>

  <!-- Directives -->
  <script src="directives/success-modal.directive.js"></script>
  <script src="directives/file-change.directive.js"></script>
  <script src="directives/chart.directive.js"></script>

  <!-- Controllers -->
  <script src="controllers/shell.controller.js"></script>
  <script src="controllers/auth/login.controller.js"></script>
  <script src="controllers/dashboard.controller.js"></script>
  <script src="controllers/products.controller.js"></script>
  <script src="controllers/combos.controller.js"></script>
  <script src="controllers/categories.controller.js"></script>
  <script src="controllers/orders/orders-list.controller.js"></script>
  <script src="controllers/orders/order-detail.controller.js"></script>
  <script src="controllers/returns.controller.js"></script>
  <script src="controllers/customers/customer-list.controller.js"></script>
  <script src="controllers/customers/customer-detail.controller.js"></script>
  <script src="controllers/reviews.controller.js"></script>
  <script src="controllers/vouchers.controller.js"></script>
  <script src="controllers/promotions.controller.js"></script>
  <script src="controllers/banners.controller.js"></script>
  <script src="controllers/blog.controller.js"></script>
</body>
</html>
