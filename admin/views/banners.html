<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="gd-h2 mb-0">Quản lý banner</h2>
  <button class="btn-gd btn-gd-primary btn-gd-sm" ng-click="vm.newBanner()" ng-if="!vm.showForm">+ Thêm banner</button>
</div>

<p ng-if="vm.loading" class="gd-loading-block">Đang tải...</p>

<div class="row g-3" ng-if="!vm.showForm">
  <div class="col-md-6" ng-repeat="b in vm.banners">
    <div class="gd-card">
      <img ng-src="{{ b.image_url }}" class="img-fluid rounded mb-2" onerror="this.onerror=null; this.src='https://placehold.co/400x200?text=No+Image';">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <span class="gd-badge gd-badge-neutral">{{ vm.positionLabel(b.position) }}</span>
          <span class="gd-badge" ng-class="b.status === 'active' ? 'gd-badge-success' : 'gd-badge-neutral'">{{ vm.statusLabel(b.status) }}</span>
        </div>
        <div>
          <button class="btn-gd btn-gd-secondary btn-gd-sm" ng-click="vm.editBanner(b)">Sửa</button>
          <button class="btn-gd btn-gd-destructive btn-gd-sm ms-1" ng-click="vm.remove(b)">Xoá</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="gd-card" ng-if="vm.showForm">
  <h3 class="gd-h3">{{ vm.editingId ? 'Sửa banner' : 'Thêm banner mới' }}</h3>
  <form ng-submit="vm.save()">
    <div class="row g-3">
      <div class="col-md-12">
        <label class="gd-label">Hình ảnh banner</label>
        <label class="gd-dropzone d-block mb-2">
          <i class="bi bi-cloud-upload"></i>
          <div>Nhấn để chọn ảnh tải lên</div>
          <input type="file" accept="image/*" style="display:none" gd-file-change="vm.onImageSelected(files)">
        </label>
        <div class="mb-2" ng-if="vm.uploading"><span class="gd-spinner-sm"></span> Đang tải ảnh lên...</div>
        <div class="gd-thumb" style="width: 200px; height: 100px;" ng-if="vm.form.image_url">
          <img ng-src="{{ vm.form.image_url }}" onerror="this.onerror=null; this.src='https://placehold.co/200x100?text=No+Image';">
          <button type="button" class="remove" ng-click="vm.form.image_url = ''">&times;</button>
        </div>
      </div>
      <div class="col-md-4">
        <label class="gd-label">Vị trí</label>
        <select class="form-select-gd" ng-model="vm.form.position">
          <option value="home_top">Đầu trang chủ</option>
          <option value="home_middle">Giữa trang chủ</option>
        </select>
      </div>
      <div class="col-md-4"><label class="gd-label">Bắt đầu</label><input type="datetime-local" class="form-control-gd" ng-model="vm.form.start_at"></div>
      <div class="col-md-4"><label class="gd-label">Kết thúc</label><input type="datetime-local" class="form-control-gd" ng-model="vm.form.end_at"></div>
    </div>
    <p class="gd-field-error mt-2" ng-if="vm.errorMessage">{{ vm.errorMessage }}</p>
    <button type="submit" class="btn-gd btn-gd-primary mt-3">Lưu</button>
    <button type="button" class="btn-gd btn-gd-secondary ms-2 mt-3" ng-click="vm.cancel()">Huỷ</button>
  </form>
</div>
