<h2 class="gd-h2 mb-3">Danh sách khách hàng</h2>

<p ng-if="vm.loading" class="gd-loading-block">Đang tải...</p>

<div class="gd-admin-table-wrap" ng-if="!vm.loading">
  <table class="table align-middle">
    <thead><tr><th>Mã KH</th><th>Tên khách hàng</th><th>Email</th><th>Điện thoại</th><th>Trạng thái</th><th></th></tr></thead>
    <tbody>
      <tr ng-repeat="c in vm.customers">
        <td>#{{ c.user_id }}</td>
        <td>{{ c.full_name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone }}</td>
        <td><span class="gd-badge" ng-class="c.status === 'active' ? 'gd-badge-success' : (c.status === 'banned' ? 'gd-badge-error' : 'gd-badge-neutral')">{{ vm.statusLabel(c.status) }}</span></td>
        <td class="text-end"><a class="btn-gd btn-gd-secondary btn-gd-sm" href="/khach-hang/{{ c.user_id }}">Xem hồ sơ</a></td>
      </tr>
      <tr ng-if="!vm.customers.length"><td colspan="6" class="text-center text-muted py-4">Không có khách hàng nào.</td></tr>
    </tbody>
  </table>
</div>

<div class="gd-pagination" ng-if="!vm.loading && vm.totalPages() > 1">
  <button ng-click="vm.goToPage(1)" ng-disabled="vm.meta.page === 1"><i class="bi bi-chevron-bar-left"></i></button>
  <button ng-click="vm.goToPage(vm.meta.page - 1)" ng-disabled="vm.meta.page === 1"><i class="bi bi-chevron-left"></i></button>
  <button ng-repeat="p in vm.pageRange()" ng-class="{active: p === vm.meta.page}" ng-click="vm.goToPage(p)">{{ p }}</button>
  <button ng-click="vm.goToPage(vm.meta.page + 1)" ng-disabled="vm.meta.page === vm.totalPages()"><i class="bi bi-chevron-right"></i></button>
  <button ng-click="vm.goToPage(vm.totalPages())" ng-disabled="vm.meta.page === vm.totalPages()"><i class="bi bi-chevron-bar-right"></i></button>
</div>
<p class="text-muted mt-2" ng-if="!vm.loading">Tổng cộng {{ vm.meta.total }} khách hàng</p>
